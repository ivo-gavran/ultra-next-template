services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ultra
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra -d ultra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ultra_postgres_data:/var/lib/postgresql/data

volumes:
  ultra_postgres_data:
