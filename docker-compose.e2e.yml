services:
  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ultra_e2e
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra -d ultra_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
